{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MyShop - Login</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: linear-gradient(
        135deg,
        #2874f0,
        #6ea8fe
    );

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;
}

.login-box {

    width: 90%;

    max-width: 430px;

    background: white;

    padding: 35px;

    border-radius: 15px;

    box-shadow:
        0 12px 0 rgba(0,0,0,0.15),
        0 20px 40px rgba(0,0,0,0.25);
}

.logo {

    text-align: center;

    margin-bottom: 20px;
}

.logo img {

    width: 65px;

    height: 65px;

    object-fit: contain;

    border-radius: 50%;

    background: white;
}

h1 {

    text-align: center;

    color: #2874f0;

    margin-bottom: 8px;
}

.subtitle {

    text-align: center;

    color: #777;

    margin-bottom: 25px;
}

.form-group {

    margin-bottom: 18px;
}

label {

    display: block;

    font-weight: bold;

    margin-bottom: 6px;
}

input {

    width: 100%;

    padding: 13px;

    border: 1px solid #ccc;

    border-radius: 7px;

    font-size: 15px;
}

input:focus {

    outline: none;

    border-color: #2874f0;

    box-shadow:
        0 0 0 3px rgba(40,116,240,0.12);
}

.errorlist {

    color: #d32f2f;

    font-size: 13px;

    padding-left: 18px;
}

.login-btn {

    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 8px;

    background: linear-gradient(
        145deg,
        #3d8bfd,
        #2874f0
    );

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 6px 0 #1658b8,
        0 10px 18px rgba(0,0,0,0.18);

    transition:
        transform 0.12s ease,
        box-shadow 0.12s ease;
}

.login-btn:hover {

    transform: translateY(-3px);

    box-shadow:
        0 9px 0 #1658b8,
        0 15px 23px rgba(0,0,0,0.22);
}

.login-btn:active {

    transform: translateY(5px);

    box-shadow:
        0 1px 0 #1658b8,
        0 4px 8px rgba(0,0,0,0.15);
}

.register-text {

    text-align: center;

    margin-top: 22px;

    color: #555;
}

.register-text a {

    color: #2874f0;

    font-weight: bold;

    text-decoration: none;
}

.register-text a:hover {

    text-decoration: underline;
}

.home-link {

    display: block;

    text-align: center;

    margin-top: 15px;

    color: #777;

    text-decoration: none;
}

.home-link:hover {

    color: #2874f0;
}

</style>

</head>

<body>

<div class="login-box">

    <div class="logo">

        <img
            src="{% static 'images/my shop logo.png' %}"
            alt="MyShop Logo"
        >

    </div>

    <h1>Welcome Back</h1>

    <p class="subtitle">
        Login to your MyShop account
    </p>

    <form method="POST">

        {% csrf_token %}

        {{ form.non_field_errors }}

        <div class="form-group">

            <label for="{{ form.username.id_for_label }}">
                Username
            </label>

            {{ form.username }}

            {{ form.username.errors }}

        </div>

        <div class="form-group">

            <label for="{{ form.password.id_for_label }}">
                Password
            </label>

            {{ form.password }}

            {{ form.password.errors }}

        </div>

        <button
            type="submit"
            class="login-btn"
        >
            Login
        </button>

    </form>

    <div class="register-text">

        Don't have an account?

        <a href="{% url 'register' %}">
            Create Account
        </a>

    </div>

    <a
        href="{% url 'home' %}"
        class="home-link"
    >
        ← Back to MyShop
    </a>

</div>

</body>

</html>
